name: Flutter Tag Build

on:
  workflow_dispatch:
    inputs:
      macos-only:
        description: "Build and publish only the macOS packages"
        type: boolean
        default: false
  # Automatic triggers disabled; run manually only.
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'
  #     - '[0-9]+.[0-9]+.[0-9]+'
  #     - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  #     - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      macos-only: ${{ inputs.macos-only }}
